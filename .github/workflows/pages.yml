name: Build benchmark site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [submissions-updated]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Read approved community reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run sync
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bundle exec jekyll build --strict_front_matter --baseurl "$PAGES_BASE_PATH"
      - name: Check generated local links and images
        run: node scripts/check-site.mjs _site "$PAGES_BASE_PATH"
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
