<figure class="comparison" id="{{ include.pair.id | escape }}"{% if include.pair.aligned %} data-comparison{% endif %}>
  {% assign heading_level = include.heading_level | default: 2 %}
  <h{{ heading_level }}>{{ include.pair.title | escape }}</h{{ heading_level }}>
  <div class="comparison-images">
    <div class="comparison-before"><img src="{{ '/assets/images/' | append: include.pair.before | relative_url }}" alt="{{ include.pair.before_label | escape }}" width="800" height="600" loading="lazy"><span>{{ include.pair.before_label | escape }}</span></div>
    <div class="comparison-after"><img src="{{ '/assets/images/' | append: include.pair.after | relative_url }}" alt="{{ include.pair.after_label | escape }}" width="800" height="600" loading="lazy"><span>{{ include.pair.after_label | escape }}</span></div>
  </div>
  {% if include.pair.aligned %}<label class="comparison-control" hidden>Reveal denoised image <input type="range" min="0" max="100" value="50" aria-label="Denoised image reveal for {{ include.pair.title | escape }}"></label>{% endif %}
  <figcaption>{{ include.pair.caption | escape }}</figcaption>
</figure>
